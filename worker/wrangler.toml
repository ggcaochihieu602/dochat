name = "dochat"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
BACKEND_URL = "https://dochat1.onrender.com"
ALLOWED_USER_IDS = "8950411699,8986495659"
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"

[[kv_namespaces]]
binding = "CONVERSATIONS"
id = "ff3bd3ffee4a4a46975f8467b03438ea"

[[queues.producers]]
binding = "JOBS"
queue = "dochat-jobs"

[[queues.consumers]]
queue = "dochat-jobs"
max_batch_size = 1
max_retries = 3

[ai]
binding = "AI"
